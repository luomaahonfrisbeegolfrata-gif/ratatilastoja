const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function sparklineSVG(data,color="#1aff1a",fill=true,w=100,h=22){
  if(!data||data.length<2)return"";
  const max=Math.max(...data),min=Math.min(...data),range=max-min||1;
  const pts=data.map((v,i)=>((i/(data.length-1))*w).toFixed(1)+","+(h-((v-min)/range)*h*0.8-h*0.1).toFixed(1)).join(" ");
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'">'+(fill?'<polygon points="0,'+h+' '+pts+' '+w+','+h+'" fill="'+color+'" opacity="0.18"/>':'')+'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function renderInfo(v){
  const N=v.vayla_count, par=+v.par[N], avg=+v.avg[N], over=avg-par;
  const bp=v.birdie_pct, tot=v.plays_per_hole.reduce((a,b)=>a+b,0);

}
function renderVayla(v){

    ["Par",...v.par],
    ["Avg",...v.avg],
    ["Luokitus","LK"],
    ["Vaikeus (1=vaikein)","VK"],

    ["Hole in one",...v.hio.slice(0,N+1),"-"],

    ["Birdie -1",...v.birdie],
    ["Par 0",...v.par0],
    ["Bogey 1",...v.bogey],
    ["Dbl Bogey 2",...v.dbl],
    ["Tpl Bogey 3",...v.tpl],
    ["Other >3",...v.other]
  ];
  const spark={2:[v.avg.slice(0,N).map(Number),"#ff9800",true],3:[v.birdie_pct,"#1aff1a",true],4:[v.difficulty.slice(0,N).map(Number),"#1aff1a",false],5:[v.risk.slice(0,N).map(s=>parseFloat(s)),"#e5534b",true],8:[pct(v.birdie),"#1aff1a",true],10:[pct(v.bogey),"#ff4d4d",true]};
  const body=document.getElementById("vayla-body"); body.innerHTML="";
  rows.forEach((row,ri)=>{
    let html='<td>'+esc(row[0])+'</td>';
    if(row[1]==="LK"){
      html+=v.luokitus.map(lk=>'<td class="lk '+lk.cls+'" title="Birdie tai parempi '+lk.pct.toFixed(1)+' % kaikista tuloksista">'+lk.label+'<span class="sub">'+lk.pct.toFixed(1)+'%</span></td>').join("")+'<td>-</td><td>-</td>';
    }else if(row[1]==="VK"){
      html+=v.difficulty.slice(0,N).map((d,i)=>{const o=v.over_all[i];return '<td class="'+v.diffCls[i]+'" title="Keskitulos '+v.avg[i]+', par '+v.par[i]+'">'+d+'/'+N+'<span class="sub">'+(o>=0?"+":"")+o.toFixed(2)+' ka.</span></td>';}).join("")+'<td>-</td><td>-</td>';

      html+=row.slice(1).map(c=>'<td>'+esc(c)+'</td>').join("");
    }

    html+='<td class="cell-trendi">'+(s?sparklineSVG(s[0],s[1],s[2]):'<span style="color:#333">-</span>')+'</td>';
    const tr=document.createElement("tr"); tr.innerHTML=html; body.appendChild(tr);
  });
  const bp=v.birdie_pct, diffs=v.difficulty.slice(0,N).map(Number), maxY=Math.max(...bp)||1;
  const sorted=diffs.map((d,i)=>({x:d,y:bp[i],hole:i+1})).sort((a,b)=>a.x-b.x);
  document.getElementById("corr").innerHTML='<b>BIRDIE-% VAIKEIMMASTA HELPPOIMPAAN</b><div class="corr-bars">'+sorted.map(p=>{const h=(p.y/maxY)*18+4,col=p.y>15?"#1aff1a":p.y>8?"#ffeb3b":p.y>4?"#ff9800":"#e5534b";return '<div title="V'+p.hole+': '+p.y.toFixed(1)+'% birdie, vaikeus '+p.x+'/'+N+'"><div style="width:100%;height:'+h.toFixed(0)+'px;background:'+col+';border-radius:2px;opacity:.9"></div><span>V'+p.hole+'</span></div>';}).join("")+'</div>';
  document.getElementById("vayla-note").textContent=v.note;

}
